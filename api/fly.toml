# Fly.io app definition. One small machine is plenty for an MVP.
#
#   cd api
#   fly launch --no-deploy --copy-config      # creates the app, keeps this file
#   fly secrets set MONGODB_URI="mongodb+srv://..." ANTHROPIC_API_KEY="sk-ant-..."
#   fly deploy
#
# Change `app` to a name that is free on Fly; the URL becomes https://<app>.fly.dev.

app = "your-person-api"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
