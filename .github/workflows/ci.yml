# Runs on every push and pull request: the API's lint, tests and build on
# Linux, and the iPhone app compiled for the simulator on a Mac runner.
# No secrets needed; the iOS job builds unsigned.
name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Build for the simulator
        run: |
          xcodebuild -version
          xcodebuild \
            -project YourPerson.xcodeproj \
            -scheme YourPerson \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
