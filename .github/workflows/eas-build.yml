# Builds the iPhone and Android apps in the cloud with EAS Build.
#
# One-time setup:
#   1. Create an Expo account and run `npx eas-cli@latest init` in app/ once locally
#      (writes the project id into app.json). Commit that change.
#   2. Create an access token at https://expo.dev/accounts/[you]/settings/access-tokens
#      and add it to this repo as the secret EXPO_TOKEN.
#   3. Run this workflow from the Actions tab. Pick the platform and profile.
#      `preview` builds install on your own phones; `production` builds go to the stores.
#
# The build runs on Expo's machines (a Mac for iOS), so no Mac is needed here.
name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        default: ios
        options: [ios, android, all]
      profile:
        description: Build profile (see app/eas.json)
        type: choice
        default: preview
        options: [development, preview, production]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck and lint
        run: npm run typecheck && npm run lint

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
